name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Config schema is up to date
        run: |
          node dist/cli.js --schema /tmp/fantocci.schema.json
          diff -u fantocci.schema.json /tmp/fantocci.schema.json
      - name: Docker image builds
        run: docker build -t fantocci:ci .
