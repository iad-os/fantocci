# Example configuration. Copy to ./fantocci.yaml (git-ignored) or point to it with
# `fantocci --config <file>` / FANTOCCI_CONFIG. Every key is optional.
# Editor validation: keep the line below (needs the redhat.vscode-yaml extension).
# yaml-language-server: $schema=./fantocci.schema.json

port: 3000
host: 0.0.0.0
logLevel: info

# Comma separated common names for a self-signed certificate, or false.
https: false

anything:
  delay: 1          # default delay (ms) for /anything
  maxDelay: 600000  # max accepted delay (ms)

colors:
  title: Colors
  description: This is a colors plugin

# OIDC tools (/oidc/*). Set to `false` (or omit) to disable.
oidc: false
# oidc:
#   issuer: https://idp.example.com/realms/demo
#   discovery: https://idp.example.com/realms/demo/.well-known/openid-configuration
#   clientId: fantocci
#   clientSecret: change-me
#   tokenHeader: x-auth-token
